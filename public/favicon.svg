<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Radiant Cyber-Boto Body Gradient -->
    <linearGradient id="botoBody" x1="15%" y1="85%" x2="85%" y2="15%">
      <stop offset="0%" stop-color="#3730a3"/>
      <stop offset="25%" stop-color="#4f46e5"/>
      <stop offset="55%" stop-color="#6366f1"/>
      <stop offset="85%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>

    <!-- Hydrofoil Fin & Fluke Gradient -->
    <linearGradient id="botoAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="60%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>

    <!-- Timeline Horizon Wave Beam -->
    <linearGradient id="timelineHorizon" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.6"/>
      <stop offset="85%" stop-color="#38bdf8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <!-- Beacon Aperture Glow -->
    <filter id="eyeGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#38bdf8" flood-opacity="1"/>
    </filter>

    <!-- Dynamic Elevation Glow -->
    <filter id="botoElevation" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#4f46e5" flood-opacity="0.42"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#38bdf8" flood-opacity="0.28"/>
    </filter>
  </defs>

  <g filter="url(#botoElevation)">
    <!-- 1. Timeline Horizon Wave (The 'View' Horizon Vector) -->
    <path d="M 64 380
             C 152 384, 230 366, 314 312
             C 380 270, 426 216, 452 172
             C 424 228, 364 292, 284 336
             C 204 380, 136 390, 64 380
             Z" 
          fill="url(#timelineHorizon)"/>

    <!-- 2. Cyber-Boto Body (Streamlined Aerodynamic Leap) -->
    <path d="M 94 378
             C 106 342, 138 278, 192 206
             C 246 134, 310 88, 386 92
             C 438 96, 460 134, 462 164
             C 464 198, 436 238, 388 280
             C 334 326, 260 358, 188 376
             C 146 386, 114 386, 94 378
             Z" 
          fill="url(#botoBody)"/>

    <!-- 3. Dorsal Fin (Streamlined Crest on Back) -->
    <path d="M 288 108
             C 318 64, 350 42, 372 38
             C 368 68, 352 98, 330 118
             Z" 
          fill="url(#botoAccent)"/>

    <!-- 4. Pectoral Fin (Hydrofoil Flipper pointing forward) -->
    <path d="M 296 292
             C 336 312, 376 348, 392 382
             C 360 374, 324 348, 296 320
             Z" 
          fill="url(#botoAccent)"/>

    <!-- 5. Tail Flukes (Aerodynamic Split Hydrofoil) -->
    <path d="M 94 378
             C 76 352, 54 336, 40 332
             C 54 362, 72 388, 84 402
             C 70 422, 54 444, 42 456
             C 66 446, 88 420, 100 398
             Z" 
          fill="url(#botoAccent)"/>

    <!-- 6. Optical Viewfinder Lens (The 'View' Eye) -->
    <circle cx="420" cy="154" r="13" fill="#ffffff" filter="url(#eyeGlow)"/>
    <circle cx="420" cy="154" r="6.5" fill="#0284c7"/>
    <circle cx="418" cy="152" r="2.5" fill="#ffffff"/>
  </g>
</svg>