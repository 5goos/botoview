name: IndexNow SEO Submission

on:
  workflow_run:
    workflows:
      - "Deploy to Cloudflare"
      - "Deploy"
      - "Cloudflare Pages"
      - "Daily Boto Changelogs Sync"
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit-indexnow:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"

      - name: Verify Live Deployment & Submit IndexNow
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          if [ -z "$INDEXNOW_KEY" ]; then
            echo "::error::INDEXNOW_KEY secret is not configured in repository settings."
            exit 1
          fi

          echo "Polling dynamic IndexNow key endpoint to ensure production deployment is live..."
          MAX_ATTEMPTS=24
          DELAY=10
          IS_LIVE=false

          for ((i=1; i<=MAX_ATTEMPTS; i++)); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -L "https://botoview.5goos.com/${INDEXNOW_KEY}.txt" || true)
            if [ "$HTTP_CODE" = "200" ]; then
              BODY=$(curl -s -L "https://botoview.5goos.com/${INDEXNOW_KEY}.txt" || true)
              if [ "$BODY" = "$INDEXNOW_KEY" ]; then
                echo "Verification endpoint is live and verified on attempt $i."
                IS_LIVE=true
                break
              else
                echo "Attempt $i/$MAX_ATTEMPTS: Endpoint returned HTTP 200 but body did not match expected key. Waiting ${DELAY}s..."
              fi
            else
              echo "Attempt $i/$MAX_ATTEMPTS: Endpoint returned HTTP $HTTP_CODE. Waiting ${DELAY}s..."
            fi
            sleep $DELAY
          done

          if [ "$IS_LIVE" = false ]; then
            echo "::error::Verification endpoint https://botoview.5goos.com/${INDEXNOW_KEY}.txt did not return HTTP 200 with the matching key within timeout. Ensure INDEXNOW_KEY is configured in Cloudflare Worker environment variables and production deployment has completed."
            exit 1
          fi

          python3 scripts/ping_indexnow.py
